services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kofa
      POSTGRES_USER: kofa
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD privately}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kofa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kofa -d kofa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kofa-postgres:
